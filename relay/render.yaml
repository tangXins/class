# Render 部署配置（免费 Web Service）
# 用法：Render Dashboard → New → Web Service → 连接 Git 仓库
#       Root Directory 填 relay → Render 自动读取本文件部署
#
# 注意：PORT 由 Render 平台自动注入，切勿硬编码（否则健康检查失败）

services:
  - name: classmanager-relay
    type: web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node relay-server.js
