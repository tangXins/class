<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="Expires" content="0">
<title>班级管理大师 · 手机端</title>
<style>
  :root{
    --bg:#07070f; --bg2:#0e0e1f; --card:rgba(26,26,48,.72); --card-solid:#17172e;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --accent:#00d4ff; --accent2:#7c3aed; --accent3:#ec4899;
    --grad:linear-gradient(135deg,#00d4ff 0%,#7c3aed 100%);
    --grad-pink:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);
    --text:#eef0ff; --dim:#8b8da8; --faint:#5c5e78;
    --ok:#00e08a; --warn:#ffb020; --danger:#ff4d6d;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow:0 12px 40px rgba(0,0,0,.45);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","微软雅黑",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(560px 380px at -10% -8%,rgba(124,58,237,.30),transparent 60%),
      radial-gradient(520px 360px at 112% -4%,rgba(0,212,255,.20),transparent 55%),
      radial-gradient(700px 500px at 50% 120%,rgba(236,72,153,.10),transparent 60%);
  }
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent2));border-radius:4px}

  #app{position:relative;z-index:1;max-width:540px;margin:0 auto;min-height:100dvh}

  /* ================= 入口页 ================= */
  #gate{padding:calc(40px + env(safe-area-inset-top)) 22px 40px;animation:fadeUp .5s var(--ease)}
  .gate-brand{text-align:center;margin-bottom:26px}
  .gate-logo{
    width:92px;height:92px;margin:0 auto 16px;border-radius:26px;
    background:var(--grad);display:flex;align-items:center;justify-content:center;
    font-size:46px;box-shadow:0 16px 44px rgba(0,140,255,.35),inset 0 1px 0 rgba(255,255,255,.35);
    animation:logoBreath 3.2s ease-in-out infinite;
  }
  @keyframes logoBreath{0%,100%{transform:translateY(0);box-shadow:0 16px 44px rgba(0,140,255,.35),inset 0 1px 0 rgba(255,255,255,.35)}50%{transform:translateY(-5px);box-shadow:0 22px 56px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.35)}}
  .gate-brand h1{font-size:27px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(90deg,#7fe9ff,#b79bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .gate-brand p{margin-top:7px;font-size:12.5px;color:var(--dim);letter-spacing:.5px}

  .gate-sec-label{font-size:11.5px;color:var(--faint);margin:18px 4px 9px;display:flex;align-items:center;gap:7px;letter-spacing:.5px}
  .gate-sec-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

  .room-card{
    display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--r-md);
    background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);
    margin-bottom:10px;position:relative;overflow:hidden;
    transition:transform .2s var(--ease),border-color .2s;
  }
  .room-card:active{transform:scale(.975)}
  .room-card::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:3px;background:var(--grad)}
  .room-card.offline{opacity:.55}
  .room-card.offline::before{background:#444}
  .room-ava{
    width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(124,58,237,.22));
    border:1px solid var(--line2);
  }
  .room-info{flex:1;min-width:0}
  .room-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room-meta{font-size:11.5px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:6px}
  .od{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(0,224,138,.6);animation:odPulse 1.8s infinite}
  .od.off{background:#555;animation:none;box-shadow:none}
  @keyframes odPulse{0%{box-shadow:0 0 0 0 rgba(0,224,138,.55)}70%{box-shadow:0 0 0 7px rgba(0,224,138,0)}100%{box-shadow:0 0 0 0 rgba(0,224,138,0)}}
  .room-go{color:var(--accent);font-size:18px;flex:none}

  .scan-btn{
    width:100%;margin-top:16px;padding:17px;border-radius:var(--r-md);
    background:var(--grad);color:#061018;font-size:16px;font-weight:800;letter-spacing:1px;
    box-shadow:0 12px 32px rgba(0,150,255,.32);position:relative;overflow:hidden;
    transition:transform .15s var(--ease);
  }
  .scan-btn:active{transform:scale(.97)}
  .scan-btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);
    animation:scanShine 3.4s infinite}
  @keyframes scanShine{0%,60%{left:-60%}100%{left:130%}}

  .gate-status{text-align:center;margin-top:14px;font-size:13px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px}
  .spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .gate-diag{margin-top:12px;text-align:center;font-size:10.5px;color:var(--faint);word-break:break-all;line-height:1.7}
  .gate-note{margin-top:16px;font-size:11px;line-height:1.85;color:var(--dim);
    border:1px dashed var(--line2);border-radius:var(--r-md);padding:12px 14px;background:rgba(255,255,255,.02)}

  .empty-mini{text-align:center;padding:22px 12px;color:var(--faint);font-size:12.5px;line-height:1.9}
  .empty-mini .ico{font-size:30px;display:block;margin-bottom:8px;opacity:.8}

  /* ================= 主框架 ================= */
  #main{display:none;min-height:100dvh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .appbar{
    position:sticky;top:0;z-index:40;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    background:linear-gradient(180deg,rgba(7,7,15,.92),rgba(7,7,15,.55) 70%,transparent);
    backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;
  }
  .ab-title{font-size:18px;font-weight:800;letter-spacing:.5px}
  .ab-sub{font-size:11px;color:var(--dim);margin-top:2px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ab-sp{flex:1}
  .chip-conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
    border:1px solid var(--line2);border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.03)}

  .page{display:none;padding:6px 16px 20px;animation:fadeUp .32s var(--ease)}
  .page.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 浮动底栏 */
  .tabbar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;
    width:calc(100% - 32px);max-width:420px;
    display:flex;justify-content:space-around;align-items:center;
    background:rgba(18,18,36,.82);border:1px solid var(--line2);border-radius:999px;
    padding:7px;backdrop-filter:blur(18px);box-shadow:var(--shadow);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;color:var(--faint);padding:6px 0;border-radius:999px;position:relative;
    transition:color .25s;}
  .tab .ti{font-size:19px;line-height:1;transition:transform .25s var(--ease)}
  .tab.active{color:#061018;font-weight:700;background:var(--grad);box-shadow:0 6px 18px rgba(0,150,255,.35)}
  .tab.active .ti{transform:translateY(-1px) scale(1.08)}
  .tab .badge{
    position:absolute;top:0;right:18%;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
    background:var(--danger);color:#fff;font-size:10px;line-height:16px;font-weight:700;text-align:center;
    animation:badgePop .3s var(--ease);
  }
  @keyframes badgePop{0%{transform:scale(0)}100%{transform:scale(1)}}

  /* ================= 卡片/通用 ================= */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:15px;margin-bottom:13px;backdrop-filter:blur(12px);
    animation:cardIn .4s var(--ease) backwards;
  }
  .card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px}
  .sp{flex:1}
  .cnt{font-size:11px;color:var(--accent);background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);
    border-radius:999px;padding:1px 8px;font-weight:700}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
    padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.04);
    border:1px solid var(--line2);color:var(--dim);transition:all .2s;
  }
  .chip.sel{background:var(--grad);color:#061018;border-color:transparent;box-shadow:0 5px 16px rgba(0,150,255,.3)}
  .chip.add{border-style:dashed;color:var(--accent)}
  .chip .x{font-size:11px;opacity:.65;padding:0 1px}
  .chip.sel .x{opacity:.8}

  .lrow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:var(--r-sm);}
  .lrow:active{background:rgba(255,255,255,.04)}
  .lava{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .lmain{flex:1;min-width:0}
  .lname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .lsub{font-size:11px;color:var(--faint);margin-top:2px}
  .lacts{display:flex;gap:4px;flex:none}
  .ib{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);transition:all .15s}
  .ib:active{transform:scale(.9)}
  .ib.danger{background:rgba(255,77,109,.12);border-color:rgba(255,77,109,.3)}
  .wbadge{font-size:10px;color:var(--warn);background:rgba(255,176,32,.1);border-radius:6px;padding:1px 6px;margin-left:auto}

  .btn{padding:12px;border-radius:var(--r-md);font-size:14px;font-weight:700;transition:transform .15s,filter .2s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--grad);color:#061018;box-shadow:0 8px 22px rgba(0,150,255,.28)}
  .btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--text)}
  .btn-danger{background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.4);color:var(--danger)}
  .btn-block{width:100%;margin-top:9px}
  .btn-sm{padding:6px 13px;font-size:12px;border-radius:999px}
  .loading{padding:20px;text-align:center;color:var(--dim);font-size:12.5px}
  .retry-btn{margin-top:10px;font-size:12px;color:var(--accent);text-decoration:underline}

  /* ================= 消息对话 ================= */
  .chat{padding:8px 2px 10px;display:flex;flex-direction:column;gap:13px;min-height:50vh}
  .bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.65;
    word-break:break-word;position:relative;animation:bubbleIn .3s var(--ease)}
  @keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .b-in{align-self:flex-start;background:var(--card-solid);border:1px solid var(--line);
    border-top-left-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .b-me{align-self:flex-end;background:var(--grad);color:#061018;border-top-right-radius:5px;font-weight:600;
    box-shadow:0 6px 18px rgba(80,110,255,.35)}
  .b-sys{align-self:center;background:rgba(255,255,255,.05);border:1px dashed var(--line2);
    color:var(--dim);font-size:11.5px;border-radius:999px;padding:5px 14px;max-width:90%;text-align:center}
  .b-sender{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .b-sender .sa{width:18px;height:18px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;color:#fff;font-weight:700}
  .b-time{font-size:10px;opacity:.55;margin-top:4px;text-align:right}
  .b-me .b-time{opacity:.7}

  .composer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
    width:calc(100% - 24px);max-width:516px;z-index:30}
  .quick-tags{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .quick-tags::-webkit-scrollbar{display:none}
  .quick-tag{flex:none;font-size:12px;padding:6px 13px;border-radius:999px;
    background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);color:var(--accent);font-weight:600}
  .quick-tag:active{transform:scale(.94)}
  .composer-row{display:flex;gap:9px;background:rgba(18,18,36,.88);border:1px solid var(--line2);
    border-radius:999px;padding:6px 6px 6px 16px;backdrop-filter:blur(18px);box-shadow:var(--shadow)}
  .ipt{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:var(--r-sm);
    color:var(--text);font-size:14px;padding:11px 13px;outline:none}
  .ipt:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.12)}
  .composer-row .ipt{border:none;background:transparent;flex:1;padding:8px 4px;font-size:14px;max-height:90px}
  .composer-row .btn{padding:9px 18px;margin:0;border-radius:999px}

  /* ================= 教材 ================= */
  .cat-unit-head{font-size:12.5px;font-weight:700;color:var(--accent);margin:14px 2px 7px;display:flex;align-items:center;gap:7px}
  .cat-unit-head::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--grad)}
  .cat-q{display:flex;align-items:center;gap:11px;padding:13px 12px;border-bottom:1px solid var(--line);transition:background .15s}
  .cat-q:last-child{border-bottom:none}
  .cat-q:active{background:rgba(0,212,255,.05)}
  .cat-q .qi{font-size:17px}
  .cat-q .qt{flex:1;font-size:13.5px;font-weight:600}
  .cat-q .arrow{font-size:11.5px;color:var(--faint)}
  .article-content{font-size:15px;line-height:2.05;white-space:pre-wrap;color:var(--text);font-family:"PingFang SC","微软雅黑",serif}

  /* ================= 我的 ================= */
  .me-hero{
    border-radius:var(--r-lg);padding:20px;margin-bottom:13px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(0,212,255,.16),rgba(124,58,237,.24));
    border:1px solid var(--line2);display:flex;align-items:center;gap:15px;
  }
  .me-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(236,72,153,.25),transparent 70%)}
  .me-ava{width:58px;height:58px;border-radius:19px;background:var(--grad-pink);display:flex;align-items:center;
    justify-content:center;font-size:28px;flex:none;box-shadow:0 8px 22px rgba(124,58,237,.4)}
  .kv-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;color:var(--dim)}
  .kv-row .v{color:var(--text);font-weight:600}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  .settings-adv summary{font-size:13px;font-weight:600;outline:none;cursor:pointer}
  .switch{position:relative;display:inline-block;width:44px;height:25px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .sl{position:absolute;inset:0;background:rgba(255,255,255,.12);border-radius:999px;transition:.25s}
  .sl::before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.25s var(--ease)}
  .switch input:checked + .sl{background:var(--grad)}
  .switch input:checked + .sl::before{transform:translateX(19px)}
  .set-row{display:flex;align-items:center;gap:12px;padding:6px 2px}

  /* ================= 弹层 ================= */
  .mask{position:fixed;inset:0;z-index:90;background:rgba(3,3,10,.62);backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .mask.show{opacity:1;pointer-events:auto}
  .modal{position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-46%) scale(.94);
    width:calc(100% - 56px);max-width:400px;background:var(--bg2);border:1px solid var(--line2);
    border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:all .28s var(--ease)}
  .modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .modal h3{font-size:17px;margin-bottom:6px}
  .m-sub{font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:16px}
  .pair-input{width:100%;text-align:center;font-size:26px;font-weight:800;letter-spacing:10px;text-transform:uppercase;
    background:rgba(255,255,255,.05);border:1.5px solid var(--line2);border-radius:var(--r-md);
    color:var(--accent);padding:14px;outline:none;margin-bottom:16px}
  .pair-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,212,255,.14)}
  .modal-btns{display:flex;gap:10px}
  .modal-btns .btn{flex:1}

  /* 底部表单 */
  #sheetMask{z-index:92}
  #sheet{position:fixed;z-index:93;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;
    background:var(--bg2);border-radius:24px 24px 0 0;border:1px solid var(--line2);border-bottom:none;
    padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);
    transition:transform .32s var(--ease);box-shadow:0 -12px 44px rgba(0,0,0,.5)}
  #sheet.show{transform:none}
  #sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 14px}
  #sheet h3{font-size:16px;margin-bottom:14px;text-align:center}

  /* 横幅 */
  .banner{position:fixed;z-index:80;top:calc(64px + env(safe-area-inset-top));left:12px;right:12px;max-width:516px;margin:0 auto;
    display:flex;gap:11px;align-items:center;padding:12px 15px;border-radius:var(--r-md);
    background:linear-gradient(135deg,rgba(0,212,255,.16),rgba(124,58,237,.2));
    border:1px solid rgba(0,212,255,.4);backdrop-filter:blur(16px);box-shadow:var(--shadow);
    transform:translateY(-130%);transition:transform .35s var(--ease)}
  .banner.show{transform:none}
  .banner .b-ico{font-size:22px;animation:bellShake .6s var(--ease)}
  @keyframes bellShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
  .b-title{font-size:12.5px;font-weight:700;color:var(--accent)}
  .b-body{font-size:13.5px;margin-top:2px;line-height:1.5;max-height:42px;overflow:hidden}

  /* toast */
  .toast{position:fixed;z-index:200;bottom:calc(110px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);
    background:rgba(22,22,42,.95);border:1px solid var(--line2);color:var(--text);
    padding:11px 20px;border-radius:999px;font-size:13px;max-width:86%;text-align:center;
    opacity:0;transition:all .28s var(--ease);pointer-events:none;backdrop-filter:blur(12px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.error{border-color:rgba(255,77,109,.5);color:#ffb3c0}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 入口 ============ -->

<script>
// ============================================================
//  运行环境 / 设备身份
// ============================================================
const isNative = !!(window.Capacitor &&
  (window.Capacitor.platform === 'android' || window.Capacitor.platform === 'ios' ||
   (window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())))

// 网页扫码 = 临时模式：浏览器绝不记忆任何设备
if (!isNative) { try { localStorage.removeItem('cm_pinned') } catch {} }

function getMobileId() {
  let id = localStorage.getItem('cm_mobile_id')
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '')
      : 'm' + Date.now().toString(36) + Math.random().toString(16).slice(2, 14))
    localStorage.setItem('cm_mobile_id', id)
  }
  return id
}
function keepAliveEnabled() { return isNative && localStorage.getItem('cm_keepalive') !== '0' }

const DEFAULT_RELAY = 'wss://classmanager-relay.onrender.com'
const quickMessages = ['老师好！', '准备好了', '请抽我！', '我有问题', '再来一次', '真棒👏', '加油💪']

const state = {
  mobileId: getMobileId(),
  relayUrl: localStorage.getItem('cm_relay') || '',
  sender: localStorage.getItem('cm_sender') || '手机用户',
  ws: null,
  connected: false,
  pinnedHosts: isNative ? JSON.parse(localStorage.getItem('cm_pinned') || '[]') : [],
  discovered: [],
  currentRoom: null,
  // 当前会话（仅内存，关闭网页即失效；断线重连自动回教室，无需重输配对码）
  resume: null,
  tab: 'msg',
  unread: 0,
  msgs: [],
  grades: [], classes: [], students: [], subjects: [],
  selGrade: null, selClass: null, classLoaded: false,
  catalog: null, catGrade: null, catSubject: null, catVol: null, catalogLoaded: false,
  appInfo: null,
  _pendingDeviceId: null, _needPairForDeviceId: null, _lastJoinId: null,
  _tempPairCode: '', _failCount: 0, _lastNotify: null
}

// ============================================================
//  WebSocket
// ============================================================
function connect() {
  try {
    if (!state.relayUrl) {
      if (isNative) {
        state.relayUrl = DEFAULT_RELAY
      } else {
        try { state.relayUrl = new URL(location.href).origin.replace(/^http/, 'ws') }
        catch { setRelayStatus('❌ 无法确定服务器地址', '#ff4d6d'); return }
      }
      localStorage.setItem('cm_relay', state.relayUrl)
    }
    if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return

    const wsUrl = state.relayUrl.replace(/\/+$/, '').replace(/\/relay$/, '') + '/relay'
    setRelayStatus('🔄 正在连接…', '#ffb020', true)
    state.ws = new WebSocket(wsUrl)

    state.ws.onopen = () => {
      state.connected = true
      state._failCount = 0
      setRelayStatus('✅ 已连接，正在获取教室列表…', '#00e08a', false)
      updateBarChip()
      if (isNative) syncMainStandby()
      // 1) 断线重连：自动回到原教室（内存中的配对码，用户无感）
      if (state.resume) {
        const r = state.resume
        sendJoin(r.deviceId, r.pairCode || '', '', r.persist)
      } else if (state._pendingDeviceId) {
        // 2) 刚扫码
        const id = state._pendingDeviceId
        state._pendingDeviceId = null
        if (state.pinnedHosts.find(p => p.deviceId === id)) sendJoin(id, '', '')
        else state._needPairForDeviceId = id
      }
      wsSend({ type: 'list' })
      state._listTimer = setInterval(() => state.connected && wsSend({ type: 'list' }), 5000)
    }
    state.ws.onmessage = (raw) => {
      let msg
      try { msg = JSON.parse(raw.data) } catch { return }
      onRelayMessage(msg)
    }
    state.ws.onclose = () => {
      state.connected = false
      clearInterval(state._listTimer)
      updateBarChip()
      state._failCount++
      setRelayStatus(state._failCount <= 2 ? '🔌 断开，重连中…' : '☁️ 云端启动中，最长约 1 分钟…', '#ffb020', true)
      setTimeout(connect, 3000)
    }
    state.ws.onerror = () => setRelayStatus('☁️ 连接中（首次较慢）…', '#ffb020', true)
  } catch (e) {
    setRelayStatus('❌ ' + e.message, '#ff4d6d', false)
  }
}

function setRelayStatus(text, color, spinning) {
  const el = document.getElementById('relayStatus')
  if (el) {
    el.innerHTML = (spinning ? '<span class="spin"></span>' : '') + '<span>' + text + '</span>'
    el.style.color = color || 'var(--dim)'
  }
}
function updateBarChip() {
  const dot = document.getElementById('barDot'), txt = document.getElementById('barState')
  if (!dot) return
  dot.classList.toggle('off', !state.connected)
  txt.textContent = state.connected ? '在线' : '连接中'
}
function wsSend(obj) {
  if (state.ws && state.ws.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify(obj))
  else showToast('连接中，请稍候再试', true)
}

function sendJoin(deviceId, pairCode, content, persist) {
  state._lastJoinId = deviceId
  const doPersist = persist === undefined ? isNative : persist
  wsSend({
    type: 'join', hostDeviceId: deviceId, mobileId: state.mobileId,
    sender: state.sender, pairCode: pairCode || '', content: content || '', persist: doPersist
  })
}

// ---------- RPC（带一次自动重试） ----------
const pendingRpc = new Map()
let rpcSeq = 0
function rpcOnce(method, params, timeoutMs = 12000) {
  return new Promise((resolve, reject) => {
    if (!state.currentRoom) return reject(new Error('未连接教室'))
    const reqId = 'r' + (++rpcSeq) + '_' + Date.now().toString(36)
    const timer = setTimeout(() => {
      pendingRpc.delete(reqId)
      reject(new Error('请求超时（电脑可能不在线）'))
    }, timeoutMs)
    pendingRpc.set(reqId, {
      resolve: (d) => { clearTimeout(timer); pendingRpc.delete(reqId); resolve(d) },
      reject: (e) => { clearTimeout(timer); pendingRpc.delete(reqId); reject(new Error(e || '操作失败')) }
    })
    wsSend({ type: 'call', reqId, method, params: Array.isArray(params) ? params : [] })
  })
}
async function rpc(method, params, timeoutMs) {
  try {
    return await rpcOnce(method, params, timeoutMs)
  } catch (e) {
    await new Promise(r => setTimeout(r, 800))
    return rpcOnce(method, params, timeoutMs)
  }
}

// ---------- 中继消息分发 ----------
function onRelayMessage(msg) {
  switch (msg.type) {
    case 'list':
      state.discovered = msg.rooms || []
      renderPinned()
      if (state._needPairForDeviceId) {
        const room = state.discovered.find(r => r.deviceId === state._needPairForDeviceId)
        if (room) {
          state._pendingDeviceId = room.deviceId
          state._needPairForDeviceId = null
          openPairModal(room.name)
        }
      }
      break

    case 'joinOk': {
      closePairModal()
      const room = msg.room
      const temporary = msg.temporary || !isNative
      if (!temporary) {
        if (!state.pinnedHosts.find(p => p.deviceId === room.hostDeviceId)) {
          state.pinnedHosts.push({ deviceId: room.hostDeviceId, name: room.name, relayUrl: state.relayUrl, pairedAt: Date.now() })
          localStorage.setItem('cm_pinned', JSON.stringify(state.pinnedHosts))
        }
        applyNativeKeepAlive()
        startStandbyPool()
      }
      // 记住本次会话：断线自动重连，不再要配对码（仅内存，不落盘）
      state.resume = {
        deviceId: room.hostDeviceId,
        pairCode: state._tempPairCode || '',
        persist: !temporary
      }
      enterRoom({ deviceId: room.hostDeviceId, name: room.name, temporary })
      break
    }

    case 'chatOk':
      break

    case 'notify':
      handleIncomingNotify(msg)
      break

    case 'message':
      if (!msg.mobileId || msg.mobileId === state.mobileId) {
        receivePcMessage(msg.sender || '教室电脑', msg.content || '')
      }
      break

    case 'callResult': {
      const p = pendingRpc.get(msg.reqId)
      if (!p) break
      msg.ok ? p.resolve(msg.data) : p.reject(msg.error)
      break
    }

    case 'dataPush':
      if (msg.msg?.kind === 'dataChanged' && state.tab === 'class') refreshClassAfterChange()
      break

    case 'revoked':
      removePinnedLocally(msg.hostDeviceId)
      if (state.currentRoom?.deviceId === msg.hostDeviceId) leaveRoom(true)
      showToast('老师已取消本手机的配对，需要重新扫码')
      break

    case 'error':
      if (msg.needPair) {
        const id = state._lastJoinId
        if (id) {
          state._pendingDeviceId = id
          openPairModal(state.discovered.find(r => r.deviceId === id)?.name || '教室')
          if (msg.msg) showToast(msg.msg, true)
        } else {
          showToast(msg.msg || '需要配对码', true)
        }
      } else {
        showToast(msg.msg || '操作失败', true)
      }
      break
  }
}

// ============================================================
//  页面导航
// ============================================================
const TABS = () => isNative
  ? [['msg','💬','消息'], ['class','👥','班级'], ['catalog','📖','教材'], ['me','👤','我的']]
  : [['msg','💬','消息'], ['me','👤','我的']]
const TAB_TITLE = { msg: '消息', class: '班级管理', catalog: '教材目录', me: '我的' }

function renderTabbar() {
  document.getElementById('tabbar').innerHTML = TABS().map(([k, icon, name]) =>
    `<div class="tab ${state.tab === k ? 'active' : ''}" onclick="switchTab('${k}')">
       <span class="ti">${icon}</span>${name}
       ${k === 'msg' && state.unread ? `<span class="badge">${state.unread > 99 ? '99+' : state.unread}</span>` : ''}
     </div>`).join('')
}
function switchTab(tab) {
  if (!state.currentRoom) { showToast('请先进入教室', true); return }
  if (!TABS().find(t => t[0] === tab)) return
  state.tab = tab
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.getElementById('page-' + tab)?.classList.add('active')
  document.getElementById('barTitle').textContent = TAB_TITLE[tab]
  if (tab === 'msg') { state.unread = 0; renderMessages(); renderTabbar() }
  if (tab === 'class') ensureClassLoaded()
  if (tab === 'catalog') ensureCatalogLoaded()
  if (tab === 'me') document.getElementById('senderInput').value = state.sender
  renderTabbar()
}

function enterRoom(room) {
  state.currentRoom = room
  state.msgs = loadMsgs(room.deviceId)
  state.unread = 0
  state.grades = []; state.classes = []; state.students = []; state.subjects = []
  state.selGrade = null; state.selClass = null; state.classLoaded = false
  state.catalog = null; state.catGrade = null; state.catSubject = null; state.catVol = null; state.catalogLoaded = false
  state.appInfo = null

  document.getElementById('gate').style.display = 'none'
  document.getElementById('main').style.display = 'block'
  document.getElementById('barSub').textContent = room.name + (room.temporary ? ' · 临时连接' : '')
  document.getElementById('meRoom').textContent = room.name + (room.temporary ? '（临时连接）' : '')
  document.getElementById('meName').textContent = state.sender
  document.getElementById('keepAliveCard').style.display = isNative ? 'block' : 'none'
  document.getElementById('unpairBtn').style.display = isNative ? 'block' : 'none'
  document.getElementById('quickTags').innerHTML = quickMessages
    .map(m => `<div class="quick-tag" onclick="insertQuick('${m}')">${m}</div>`).join('')
  updateBarChip()
  switchTab('msg')
  renderTabbar()

  rpc('appInfo').then(info => {
    state.appInfo = info
    document.getElementById('curVersion').textContent = 'v' + (info.version || '?')
    if (info.className) document.getElementById('meRoom').textContent = info.className + (room.temporary ? '（临时连接）' : '')
  }).catch(() => {})
}

function leaveRoom(silent) {
  const room = state.currentRoom
  state.currentRoom = null
  state.resume = null   // 主动离开：清除会话，下次需重新扫码
  if (room && isNative) {
    wsSend({ type: 'standby', hostDeviceId: room.deviceId, mobileId: state.mobileId, sender: state.sender })
    setTimeout(syncMainStandby, 300)
  }
  hideBanner()
  document.getElementById('main').style.display = 'none'
  document.getElementById('gate').style.display = 'block'
  renderPinned()
  if (!silent) showToast('已离开教室')
}

// ============================================================
//  入口页
// ============================================================
function renderPinned() {
  const wrap = document.getElementById('pinnedWrap')
  const el = document.getElementById('pinnedRooms')
  wrap.style.display = isNative ? 'block' : 'none'
  document.getElementById('gateNote').innerHTML = isNative
    ? '🔒 已配对教室可直接进入；未配对的教室在「附近在线教室」中点一下，输入一次配对码即可。'
    : '🌐 <b>网页临时模式</b>：点下方教室输入一次配对码即可进入，<b>不会记住本设备</b>，本次连接内不会重复要求配对码。<br>完整功能（班级管理 / 教材目录 / 后台消息）请安装 Android App。'

  if (!isNative) { el.innerHTML = '' }
  else if (!state.pinnedHosts.length) {
    el.innerHTML = `<div class="empty-mini"><span class="ico">📋</span>还没有配对的教室<br>在「附近在线教室」中点击教室，输入一次配对码即可永久配对</div>`
  } else {
    el.innerHTML = state.pinnedHosts.map(p => {
      const live = state.discovered.find(d => d.deviceId === p.deviceId)
      return `<div class="room-card ${live ? '' : 'offline'}" onclick="tryJoinRoom('${p.deviceId}')">
        <div class="room-ava">🏫</div>
        <div class="room-info">
          <div class="room-name">${esc(p.name)}</div>
          <div class="room-meta"><span class="od ${live ? '' : 'off'}"></span>${live ? '在线 · 点击进入' : '电脑端离线'}</div>
        </div>
        <div class="room-go">›</div>
      </div>`
    }).join('')
  }

  const dWrap = document.getElementById('discoveredWrap')
  const dEl = document.getElementById('discoveredRooms')
  const discovered = state.discovered.filter(d => !state.pinnedHosts.find(p => p.deviceId === d.deviceId))
  if (!discovered.length) {
    dWrap.style.display = 'none'
  } else {
    dWrap.style.display = 'block'
    dEl.innerHTML = discovered.map(r => `
      <div class="room-card" onclick="tryJoinDiscovered('${r.deviceId}')">

function tryJoinDiscovered(deviceId) {
  if (!state.connected) { showToast('连接中，请稍候再试', true); return }
  const room = state.discovered.find(d => d.deviceId === deviceId)
  if (!room) { showToast('教室已离线', true); return }
  state._pendingDeviceId = deviceId
  openPairModal(room.name)
}

function tryJoinRoom(deviceId) {
  const pin = state.pinnedHosts.find(p => p.deviceId === deviceId)
  if (!pin) { showToast('请扫描电脑屏幕上的二维码', true); return }
  const live = state.discovered.find(d => d.deviceId === deviceId)
  if (!live) { showToast('电脑端不在线，到教室打开软件后再试', true); return }
  if (pin.relayUrl && pin.relayUrl !== state.relayUrl) {
    state.relayUrl = pin.relayUrl
    localStorage.setItem('cm_relay', pin.relayUrl)
    state._pendingDeviceId = deviceId
    try { state.ws.close() } catch {}
    connect()
    return
  }
  state._pendingDeviceId = deviceId
  if (state.connected) { sendJoin(deviceId, '', ''); showToast('正在进入「' + pin.name + '」…') }
  else connect()
}

function openPairModal(roomName) {

// ---------- 扫码 ----------
async function startScan() {
  const scanner = window.Capacitor?.Plugins?.CapacitorBarcodeScanner
  if (!scanner) {
    showToast('请用手机相机/微信扫电脑屏幕上的二维码', true)
    return
  }
  try {
    showToast('正在启动相机…')
    const result = await scanner.scanBarcode({ hint: 17 })
    if (result && result.ScanResult) handleQrContent(result.ScanResult)
    else showToast('未识别到二维码', true)
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e || '')
    if (/cancel/i.test(msg)) { /* 用户取消 */ }
    else if (/permission|camera/i.test(msg)) showToast('请在系统设置中授予相机权限后重试', true)
    else showToast('扫码失败：' + (msg || '未知错误'), true)
  }
}
function handleQrContent(content) {
  try {
    let r = null, d = null
    if (content.startsWith('http') || content.includes('?')) {
      const sp = new URL(content).searchParams
      r = sp.get('r'); d = sp.get('d')
    } else {
      const data = JSON.parse(content)
      r = data.r; d = data.d
    }
    if (!d) return
    state._pendingDeviceId = d
    if (r && r !== state.relayUrl) {
      state.relayUrl = r
      localStorage.setItem('cm_relay', r)
      try { state.ws.close() } catch {}
      connect()
    } else if (state.connected) {
      const pin = state.pinnedHosts.find(p => p.deviceId === d)
      pin ? sendJoin(d, '', '') : (state._needPairForDeviceId = d, wsSend({ type: 'list' }))
    }
  } catch { /* 非本系统二维码 */ }
}

function msgStorageKey(deviceId) { return 'cm_msgs_' + deviceId }
function loadMsgs(deviceId) {
  if (!isNative) return []
  try { return JSON.parse(localStorage.getItem(msgStorageKey(deviceId)) || '[]') } catch { return [] }
}
function persistMsgs() {
  if (!isNative || !state.currentRoom) return
  try { localStorage.setItem(msgStorageKey(state.currentRoom.deviceId), JSON.stringify(state.msgs.slice(-100))) } catch {}
}
function fmtTime(ts) {
  const d = new Date(ts)
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
}
function appendMsg(m) {
  state.msgs.push(m)
  if (state.msgs.length > 100) state.msgs = state.msgs.slice(-100)
  persistMsgs()
}
// PC 消息到达：前台 → 应用内横幅/列表；后台 → 系统通知栏
function receivePcMessage(sender, content) {
  appendMsg({ from: 'pc', sender, content, at: Date.now() })
  const inMsgTab = state.currentRoom && state.tab === 'msg'
  if (document.hidden || !state.currentRoom) {
    postLocalNotification(sender, content)
  }
  if (!inMsgTab) {
    state.unread++
    if (!document.hidden) showBanner(sender, content)
    renderTabbar()
  } else {
    renderMessages()
  }
}
function renderMessages() {
  const el = document.getElementById('chatList')
  if (!state.msgs.length) {
    el.innerHTML = `<div class="empty-mini" style="margin:auto"><span class="ico">📭</span>还没有消息

    return
  }
  el.innerHTML = state.msgs.map(m => {
    if (m.from === 'sys') return `<div class="bubble b-sys">${esc(m.content)}</div>`
    if (m.from === 'me') {
      return `<div class="bubble b-me">${esc(m.content)}<div class="b-time">${fmtTime(m.at)}</div></div>`
    }
    const c = avatarColor(m.sender || '电')
    return `<div class="bubble b-in">
      <div class="b-sender"><span class="sa" style="background:${c}">${esc((m.sender || '电').slice(0, 1))}</span>${esc(m.sender || '教室电脑')}</div>
      ${esc(m.content)}<div class="b-time">${fmtTime(m.at)}</div></div>`

  const ta = document.getElementById('msgInput')

  ta.value = ''

// ============================================================
//  教材目录（兼容册别结构 / 旧结构 / null 占位）
// ============================================================
// node 可能形态：
//   null                                        → 无教材
//   { 单元名: [课文...] }                        → 旧结构（单册）
//   { 上册: {单元...}, 下册: {单元...} }         → 新结构（按册）
const VOLUME_KEYS = ['上册', '下册', '全一册']
function subjectVolumes(node) {
  if (!node || typeof node !== 'object') return []
  const hasVol = VOLUME_KEYS.some(v => node[v] && typeof node[v] === 'object')
  if (hasVol) {
    return VOLUME_KEYS.filter(v => node[v] && typeof node[v] === 'object')
      .map(v => ({ name: v, units: node[v] }))
  }
  return [{ name: '', units: node }]
}
function currentSubjectNode() {
  return state.catalog?.[state.catGrade]?.[state.catSubject] || null
}

async function ensureCatalogLoaded(force) {
  if (state.catalogLoaded && !force) return
  state.catalogLoaded = true
  const el = document.getElementById('catUnits')
  el.innerHTML = `<div class="loading"><span class="spin"></span> 加载中…</div>`
  try {
    state.catalog = await rpc('catalog')
    // 默认选第一个真正有教材内容的年级/学科
    pickDefaultCatalog()
    renderCatalog()
  } catch (e) {
    el.innerHTML = `<div class="loading">${esc(e.message)}<br><button class="retry-btn" onclick="ensureCatalogLoaded(true)">🔄 重试</button></div>`
  }
}
function pickDefaultCatalog() {
  const cat = state.catalog || {}
  for (const g of Object.keys(cat)) {
    const subs = cat[g]
    if (!subs || typeof subs !== 'object') continue
    for (const s of Object.keys(subs)) {
      const vols = subjectVolumes(subs[s])
      if (vols.length && totalArticles(vols) > 0) {
        state.catGrade = g; state.catSubject = s
        state.catVol = vols[0].name || null
        return
      }
    }
  }
  // 没有任何内容：退化为第一个年级
  const g0 = Object.keys(cat)[0]
  if (g0) { state.catGrade = g0; state.catSubject = null; state.catVol = null }
}
function totalArticles(vols) {
  return vols.reduce((n, v) => n + Object.values(v.units || {}).reduce((m, list) => m + (Array.isArray(list) ? list.length : 0), 0), 0)
}
function renderCatalog() {
  const cat = state.catalog || {}
  const grades = Object.keys(cat)
  const gEl = document.getElementById('catGradeChips')
  if (!grades.length) {
    gEl.innerHTML = `<div class="loading">电脑端暂无教材数据</div>`
    document.getElementById('catSubjectChips').innerHTML = ''
    document.getElementById('catVolChips').innerHTML = ''
    document.getElementById('catUnits').innerHTML = ''
    return
  }
  if (!state.catGrade || !cat[state.catGrade]) state.catGrade = grades[0]
  gEl.innerHTML = grades.map(g =>
    `<div class="chip ${state.catGrade === g ? 'sel' : ''}" onclick="selectCatGrade('${esc(g)}')">🎓 ${esc(g)}</div>`).join('')
  renderCatalogSubjects()
}
function renderCatalogSubjects() {
  const subs = state.catalog?.[state.catGrade]
  const names = subs && typeof subs === 'object'
    ? Object.keys(subs).filter(s => subjectVolumes(subs[s]).length > 0) : []
  if (!names.includes(state.catSubject)) state.catSubject = names[0] || null
  document.getElementById('catSubjectChips').innerHTML = names.length
    ? names.map(s =>
      `<div class="chip ${state.catSubject === s ? 'sel' : ''}" onclick="selectCatSubject('${esc(s)}')">📖 ${esc(s)}</div>`).join('')
    : `<div class="loading" style="padding:6px">该年级暂无教材</div>`
  renderCatalogVolumes()
}
function renderCatalogVolumes() {
  const vols = subjectVolumes(currentSubjectNode())
  const names = vols.map(v => v.name)
  if (!names.includes(state.catVol)) state.catVol = names[0] ?? null
  const el = document.getElementById('catVolChips')
  el.innerHTML = vols.length > 1 || vols[0]?.name
    ? vols.map(v =>
      `<div class="chip ${state.catVol === v.name ? 'sel' : ''}" onclick="selectCatVol('${esc(v.name)}')">📚 ${esc(v.name || '全一册')}</div>`).join('')
    : ''
  renderCatalogUnits()
}
function renderCatalogUnits() {
  const el = document.getElementById('catUnits')
  const vols = subjectVolumes(currentSubjectNode())
  const vol = vols.find(v => v.name === state.catVol) || vols[0]
  const units = vol?.units
  if (!units) { el.innerHTML = `<div class="empty-mini">暂无教材</div>`; return }
  catArticleStore.length = 0
  let html = ''
  for (const [unit, list] of Object.entries(units)) {
    if (unit) html += `<div class="cat-unit-head">📂 ${esc(unit)}</div>`
    html += `<div style="${unit ? 'margin-top:-7px' : ''}">`
    html += (list || []).map(q => {
      const idx = catArticleStore.push(q) - 1
      return `<div class="cat-q" onclick="showArticleAt(${idx})">
         <span class="qi">📄</span><span class="qt">${esc(q.title || '未命名')}</span><span class="arrow">阅读 ›</span>
       </div>`
    }).join('')
    html += `</div>`
  }
  el.innerHTML = html || `<div class="empty-mini">暂无课文</div>`
}
const catArticleStore = []
function selectCatGrade(g) { state.catGrade = g; state.catSubject = null; state.catVol = null; renderCatalog() }
function selectCatSubject(s) { state.catSubject = s; state.catVol = null; renderCatalogVolumes() }
function selectCatVol(v) { state.catVol = v; renderCatalogUnits() }
function showArticleAt(i) {
  const q = catArticleStore[i]
  if (!q) return
  document.getElementById('infoTitle').textContent = q.title || '课文内容'
  document.getElementById('infoBody').innerHTML = `<div class="article-content">${esc(q.content || '（无内容）')}</div>`
  document.getElementById('infoMask').classList.add('show')
  document.getElementById('infoModal').classList.add('show')
}
function closeArticle() {
  document.getElementById('infoMask').classList.remove('show')
  document.getElementById('infoModal').classList.remove('show')
}

// ============================================================
//  我的 / 设置
// ============================================================
function saveSender() {
  const v = document.getElementById('senderInput').value.trim() || '手机用户'
  state.sender = v
  localStorage.setItem('cm_sender', v)
  document.getElementById('meName').textContent = v
  showToast('昵称已保存 ✅')
}
function saveRelayUrl() {
  const url = document.getElementById('relayUrlInput').value.trim()
  if (!url || url === state.relayUrl) return showToast('地址没有变化')
  state.relayUrl = url
  localStorage.setItem('cm_relay', url)
  try { state.ws.close() } catch {}
  setTimeout(connect, 300)
  showToast('正在重新连接…')
}
function resetRelayUrl() {
  state.relayUrl = DEFAULT_RELAY
  localStorage.setItem('cm_relay', DEFAULT_RELAY)
  document.getElementById('relayUrlInput').value = DEFAULT_RELAY
  try { state.ws.close() } catch {}
  setTimeout(connect, 300)
  showToast('已恢复默认中继，重新连接中…')
}
function unpairCurrent() {
  const room = state.currentRoom
  if (!room) return
  if (!confirm('解除配对后，进入该教室需要重新扫码输码，确定？')) return
  wsSend({ type: 'unpair', hostDeviceId: room.deviceId, mobileId: state.mobileId })
  removePinnedLocally(room.deviceId)
  leaveRoom(true)
  showToast('已解除配对')
}
function removePinnedLocally(hostDeviceId) {
  state.pinnedHosts = state.pinnedHosts.filter(p => p.deviceId !== hostDeviceId)
  localStorage.setItem('cm_pinned', JSON.stringify(state.pinnedHosts))
  renderPinned()
}

// ---------- 检查更新 ----------
function cmpVersion(a, b) {
  const pa = String(a).replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0)
  const pb = String(b).replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0)
  for (let i = 0; i < 3; i++) {
    if ((pa[i] || 0) > (pb[i] || 0)) return 1
    if ((pa[i] || 0) < (pb[i] || 0)) return -1
  }
  return 0
}
async function checkAppUpdate() {
  const box = document.getElementById('updateResult')
  box.innerHTML = `<div class="kv-row"><span class="k">状态</span><span class="v">正在检查…</span></div>`
  try {
    const repo = state.appInfo?.updateRepo
    if (!repo) { box.innerHTML = `<div class="kv-row"><span class="k">状态</span><span class="v" style="color:var(--warn)">电脑端未配置更新仓库</span></div>`; return }
    const r = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
      headers: { Accept: 'application/vnd.github+json' }
    })
    if (!r.ok) throw new Error('GitHub 返回 ' + r.status)
    const rel = await r.json()
    const latest = String(rel.tag_name || '').replace(/^v/, '')
    const current = state.appInfo?.version || '0'
    const apk = (rel.assets || []).find(a => String(a.name).toLowerCase().endsWith('.apk'))
    if (cmpVersion(latest, current) <= 0) {
      box.innerHTML = `<div class="kv-row"><span class="k">检查结果</span><span class="v" style="color:var(--ok)">已是最新版本 v${esc(current)}</span></div>`
      return
    }
    box.innerHTML = `
      <div class="kv-row"><span class="k">最新版本</span><span class="v" style="color:var(--accent)">v${esc(latest)}</span></div>
      ${rel.body ? `<div style="font-size:11.5px;color:var(--dim);line-height:1.7;margin:6px 0;white-space:pre-wrap">${esc(rel.body)}</div>` : ''}
      ${apk
        ? `<button class="btn btn-primary btn-block btn-sm" onclick="downloadApk('${apk.browser_download_url}')">⬇️ 下载新版 APK（${(apk.size / 1048576).toFixed(1)} MB）</button>
           <div style="font-size:10.5px;color:var(--faint);padding:7px 2px 0;line-height:1.6">下载完成后点击通知栏/下载列表里的 APK 安装；如系统拦截请允许「安装未知应用」。</div>`
        : `<button class="btn btn-ghost btn-block btn-sm" onclick="window.open('${esc(rel.html_url)}','_blank')">打开下载页面</button>`}`
  } catch (e) {
    box.innerHTML = `<div class="kv-row"><span class="k">状态</span><span class="v" style="color:var(--danger)">检查失败：${esc(e.message)}</span></div>`
  }
}
function downloadApk(url) {
  window.open(url, '_blank')
  showToast('已在浏览器中开始下载，完成后点击 APK 安装')
}

// ============================================================
//  App 后台待命 / 保活 / 连接请求
// ============================================================
function syncMainStandby() {
  if (!isNative || !keepAliveEnabled()) return
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return
  for (const p of state.pinnedHosts) {
    if ((p.relayUrl || state.relayUrl) === state.relayUrl) {
      wsSend({ type: 'standby', hostDeviceId: p.deviceId, mobileId: state.mobileId, sender: state.sender })
    }
  }
}
const standbyPool = []
function stopStandbyPool() { while (standbyPool.length) { try { standbyPool.pop().stop() } catch {} } }
function startStandbyPool() {
  stopStandbyPool()
  if (!isNative || !keepAliveEnabled()) return
  const groups = new Map()
  for (const p of state.pinnedHosts) {
    const key = p.relayUrl || state.relayUrl
    if (key === state.relayUrl) continue
    if (!groups.has(key)) groups.set(key, [])
    groups.get(key).push(p)
  }
  for (const [relay, hosts] of groups) standbyPool.push(createStandbyConn(relay, hosts))
}
function createStandbyConn(relayUrl, hosts) {
  let ws = null, stopped = false, attempts = 0, timer = null
  function sendHosts() {
    for (const h of hosts) {
      try { ws.send(JSON.stringify({ type: 'standby', hostDeviceId: h.deviceId, mobileId: state.mobileId, sender: state.sender })) } catch {}
    }
  }
  function open() {
    try { ws = new WebSocket(relayUrl.replace(/\/+$/, '').replace(/\/relay$/, '') + '/relay') } catch { return schedule() }
    ws.onopen = () => { attempts = 0; sendHosts() }
    ws.onmessage = (raw) => {
      let m
      try { m = JSON.parse(raw.data) } catch { return }
      if (m.type === 'notify') handleIncomingNotify(m)
      else if (m.type === 'revoked') removePinnedLocally(m.hostDeviceId)
    }
    ws.onclose = () => schedule()
    ws.onerror = () => {}
  }
  function schedule() {
    if (stopped) return
    attempts++
    timer = setTimeout(open, Math.min(5000, attempts * 1000))
  }
  open()
  return { stop() { stopped = true; if (timer) clearTimeout(timer); try { ws.close() } catch {} } }
}
function handleIncomingNotify(msg) {
  state._lastNotify = msg
  if (document.hidden || !state.currentRoom) postLocalNotification(msg.title || '电脑请求连接', msg.body || '')
  if (!document.hidden) showNotifyDialog(msg)
}
function showNotifyDialog(msg) {
  document.getElementById('notifyModalHost').textContent = '🏫 ' + (msg.hostName || '教室电脑')
  document.getElementById('notifyModalBody').textContent = msg.body || ''
  document.getElementById('notifyMask').classList.add('show')
  document.getElementById('notifyModal').classList.add('show')
}
function acceptNotify() {
  const m = state._lastNotify
  document.getElementById('notifyMask').classList.remove('show')
  document.getElementById('notifyModal').classList.remove('show')
  if (m?.hostDeviceId) tryJoinRoom(m.hostDeviceId)
}
function declineNotify() {
  document.getElementById('notifyMask').classList.remove('show')
  document.getElementById('notifyModal').classList.remove('show')
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state._lastNotify) showNotifyDialog(state._lastNotify)
})
function toggleKeepAlive(on) {
  localStorage.setItem('cm_keepalive', on ? '1' : '0')
  applyNativeKeepAlive()
  if (on) { syncMainStandby(); startStandbyPool() } else stopStandbyPool()
}
function applyNativeKeepAlive() {
  try {
    const ka = window.Capacitor?.Plugins?.KeepAlive
    if (!ka) return
    if (keepAliveEnabled() && state.pinnedHosts.length) ka.start().catch(() => {})
    else ka.stop().catch(() => {})
  } catch {}
}

// 点击系统通知 → 回到前台并打开消息页
try {
  window.Capacitor?.Plugins?.LocalNotifications?.addListener?.('localNotificationActionPerformed', () => {
    if (state.currentRoom) switchTab('msg')
  })
} catch {}

// ============================================================
//  工具
// ============================================================
let toastTimer
function showToast(msg, isError) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'toast show' + (isError ? ' error' : '')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600)
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}
const AVATAR_PALETTE = [
  'linear-gradient(135deg,#00d4ff,#0066ff)',
  'linear-gradient(135deg,#7c3aed,#ec4899)',
  'linear-gradient(135deg,#f59e0b,#ef4444)',
  'linear-gradient(135deg,#10b981,#06b6d4)',
  'linear-gradient(135deg,#8b5cf6,#6366f1)',
  'linear-gradient(135deg,#ec4899,#f43f5e)'
]
function avatarColor(name) {
  let h = 0
  for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length]
}

// ============================================================
//  启动
// ============================================================
;(function init() {
  try {
    const sp = new URLSearchParams(location.search)
    const r = sp.get('r'), d = sp.get('d')
    if (r) { state.relayUrl = r; localStorage.setItem('cm_relay', r) }
    if (d) state._pendingDeviceId = d
  } catch {}

  if (!state.relayUrl) {
    state.relayUrl = isNative ? DEFAULT_RELAY
      : (() => { try { return new URL(location.href).origin.replace(/^http/, 'ws') } catch { return DEFAULT_RELAY } })()
    localStorage.setItem('cm_relay', state.relayUrl)
  }

  document.getElementById('senderInput').value = state.sender
  document.getElementById('relayUrlInput').value = state.relayUrl
  document.getElementById('keepAliveInput').checked = keepAliveEnabled()

  renderPinned()
  renderTabbar()
  connect()
  if (isNative && state.pinnedHosts.length) { applyNativeKeepAlive(); startStandbyPool() }
})()
</script>
